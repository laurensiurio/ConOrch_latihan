events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://wp:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /pma/ {
            proxy_pass http://pma:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
